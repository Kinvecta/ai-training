title: "[Show and tell] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing how you used the course. Please don't post secrets, internal documents or anyone's personal data.
  - type: textarea
    id: what
    attributes:
      label: How did you use it?
      description: Self-study, a team session, a workshop. Which sessions?
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Who was in the room?
      placeholder: e.g. a policy team, developers, new hires
  - type: textarea
    id: changed
    attributes:
      label: One thing that changed in how your team works
  - type: textarea
    id: link
    attributes:
      label: Link or screenshot (optional)
